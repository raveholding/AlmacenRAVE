<style>

*{box-sizing:border-box}

textarea{min-height:90px}
label{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin:.5rem 0 .2rem}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem;box-shadow:0 2px 10px rgba(36,34,32,.05)}
.grid{display:grid;gap:1rem}

.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.sp{flex:1}

.warnbox{background:var(--warnbg);border:1px solid #f0d28a;border-radius:12px;padding:.6rem .8rem;margin:.5rem 0}

.okbox{background:var(--okbg);border:1px solid #a6d7b9;border-radius:12px;padding:.6rem .8rem;margin:.5rem 0}

.thsort{background:none;border:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:.3rem;min-height:44px;min-width:44px;padding:0 .2rem;text-align:inherit}.thsort:hover{color:var(--ink)}.thsort:focus-visible{outline:2px solid #c9963e;outline-offset:2px}th.r .thsort{justify-content:flex-end;width:100%}th[aria-sort=ascending] .thmark,th[aria-sort=descending] .thmark{color:#c9963e;font-weight:700}.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */

.rubrow{border:1px solid var(--line,#e6e0d2);border-radius:14px;padding:.6rem .8rem;margin:.5rem 0}.rubhead{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}.rubhead .btn{min-height:44px;min-width:44px}.rubhead .sp{flex:1 1 10rem;min-width:0;overflow-wrap:anywhere}.rubbody{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:flex-end;margin-top:.5rem}.rublbl{display:flex;flex-direction:column;font-size:.78rem;gap:.15rem;flex:1 1 9rem;min-width:8rem;margin:0}.rublbl input{width:100%}.rubchk{margin:0;white-space:nowrap}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(160deg,#242220,#3a342c)}
.lbox{background:#fff;border-radius:22px;padding:1.6rem;width:min(400px,100%)}

.pgrid{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem;margin-top:.7rem}
.pbtn{min-height:84px;text-align:left;padding:.6rem;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:.2rem}
.pw{display:flex;flex-direction:column;gap:.25rem}.pchips{display:flex;flex-direction:column;gap:.25rem}.pchips .btn{display:block;width:100%;height:auto;min-height:48px;padding:.3rem .55rem;font-size:.8rem;line-height:1.2;text-align:left;white-space:normal;overflow-wrap:anywhere}.pchips .btn span{display:block;color:var(--mut);font-size:.72rem}.wplv{border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;margin:.45rem 0}.wpg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.5rem}.wpg label{font-size:.74rem}
.ptw{position:relative;display:flex;flex-direction:column}.ptw>.pbtn{flex:1}.ptw.ed>.pbtn{padding-right:3.1rem}.pedq{position:absolute;top:4px;right:4px;z-index:1;min-width:44px;min-height:44px;padding:0 .35rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.8rem;font-weight:600;cursor:pointer}.pedq:hover,.pedq:focus-visible{border-color:var(--gold)}.pbtn:hover{border-color:var(--gold)}.pbtn b{font-size:.9rem}.pbtn span{font-size:.78rem;color:var(--mut)}

/* barra de teclas F (arriba de Vender) */
.fbar{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:.4rem;margin-bottom:.8rem;position:sticky;top:var(--topH,56px);z-index:4;background:var(--bg);padding:.35rem 0}

.negs{color:#b3261e;font-weight:700}
.rtabs{display:flex;flex-wrap:wrap;gap:.4rem}

.rchip{display:inline-flex;align-items:center;gap:.35rem;padding:.1rem .55rem;border-radius:999px;background:color-mix(in srgb,var(--rc) 14%,#fff);border:1px solid color-mix(in srgb,var(--rc) 45%,#fff);font-size:.8rem;font-weight:600;white-space:nowrap}
